[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "autoqq-business-plugin"
version = "0.3.3"
description = "Deterministic AutoQQ authorization, command, and delivery plugin for Hermes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1"]

[project.urls]
Homepage = "https://github.com/fkYang/hermes_qqbot_plugin"
Repository = "https://github.com/fkYang/hermes_qqbot_plugin.git"
Issues = "https://github.com/fkYang/hermes_qqbot_plugin/issues"

[project.entry-points."hermes_agent.plugins"]
autoqq-business = "autoqq_business_plugin"

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["autoqq_business_plugin"]

[tool.hatch.build.targets.wheel.force-include]
"config/commands.yaml" = "autoqq_business_plugin/config/commands.yaml"
"config/queries.yaml" = "autoqq_business_plugin/config/queries.yaml"

[tool.hatch.build.targets.sdist]
include = [
  "/autoqq_business_plugin",
  "/config",
  "/docs",
  "/tests",
  "/.env.example",
  "/__init__.py",
  "/plugin.yaml",
  "/README.md",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache", ".venv", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
